name: Preise sammeln
on:
  schedule:
    - cron: "0 9 * * *"   # 11:00 CEST bzw. 10:00 MEZ
    - cron: "0 21 * * *"  # 23:00 CEST bzw. 22:00 MEZ
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector.py collect
        env:
          TANKERKOENIG_KEY: ${{ secrets.TANKERKOENIG_KEY }}
      - run: |
          git config user.name "preis-bot"
          git config user.email "preis-bot@users.noreply.github.com"
          git add preise.db docs/data.json
          git commit -m "Preise $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
